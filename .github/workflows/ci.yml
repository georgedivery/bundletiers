name: CI

# Light checks on every push to dev, staging and main (and on pull requests into staging and main).
# staging goes to main only when this is green and the scenarios pass on the three local sites.
on:
  push:
    branches: [ dev, staging, main ]
  pull_request:
    branches: [ staging, main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Coding standard (PHPCS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpcs

  unit:
    name: Price maths and JS parity (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: php tests/pricing-test.php
      - run: php tests/js-parity-test.php

  scenarios:
    name: WooCommerce scenarios (clean site)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Start a clean WordPress with WooCommerce and the plugin
        run: npx --yes @wordpress/env@10 start
      - name: Run the scenarios
        run: |
          SLUG=$(basename "$GITHUB_WORKSPACE")
          WPENV="npx @wordpress/env@10 run cli"
          {
            echo '### WooCommerce scenarios'
            echo '```'
            $WPENV wp plugin list 2>&1 || true
            $WPENV wp eval 'echo "home_url: " . home_url() . " | locale: " . get_locale() . " | WooCommerce " . WC()->version . "\n";' 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          for scenario in cart quantity simple-product settings tax uninstall; do
            echo "== $scenario"
            if $WPENV wp eval-file "wp-content/plugins/$SLUG/tests/$scenario-scenarios.php" > "/tmp/$scenario.log" 2>&1 && grep -q "checks passed" "/tmp/$scenario.log"; then
              result="passed"
            else
              result="FAILED"
              status=1
            fi
            cat "/tmp/$scenario.log"
            # Annotations are readable without signing in to GitHub, so put the important lines there.
            if [ "$result" = "FAILED" ]; then
              text=$( { grep -m 8 -E 'Fatal error|Uncaught|PHP Warning|PHP Notice|PHP Deprecated|FAIL|Error:|Stack trace' "/tmp/$scenario.log" | cut -c1-300; echo '--- last lines:'; tail -n 4 "/tmp/$scenario.log" | cut -c1-300; } | head -c 3000 )
              encoded=$(printf '%s' "$text" | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}1')
              echo "::error title=$scenario scenario failed::$encoded"
            fi
            {
              echo "**$scenario: $result**"
              echo '```'
              tail -n 30 "/tmp/$scenario.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
